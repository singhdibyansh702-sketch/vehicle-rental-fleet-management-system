# ==============================================================================
# Development / Zero-Setup Demo Profile (H2 in MySQL-Compatibility Mode)
# ==============================================================================
# This allows instant out-of-the-box project execution and demonstration
# without requiring MySQL server to be pre-installed or running.

spring.datasource.url=jdbc:h2:mem:vehiclerental_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates and updates tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Web Console accessible at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

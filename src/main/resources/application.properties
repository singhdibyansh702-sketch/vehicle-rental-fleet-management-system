# ==============================================================================
# Full-Stack Vehicle Rental & Fleet Management System
# Monolithic Spring Boot College Mini Project Configuration
# ==============================================================================

spring.application.name=vehicle-rental-system
server.port=8081

# ------------------------------------------------------------------------------
# Active Profile:
# Set to 'mysql' to use your local MySQL database (see application-mysql.properties)
# Set to 'dev' for zero-setup demo mode with H2 in MySQL-compatibility mode
# Default is 'dev' so students/evaluators can run immediately without needing
# a pre-configured MySQL server instance, while switching to MySQL seamlessly.
# ------------------------------------------------------------------------------
spring.profiles.active=dev

# Common JPA / Hibernate settings
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# JWT Token Configuration
app.jwt.secret=VehicleRentalCollegeProjectSecretKeyMustBeAtLeast256BitsLongForHS256Security12345
app.jwt.expiration-ms=86400000

# JSON Formatting
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# File upload limits (if needed for vehicle pictures)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ==============================================================================
# MySQL Production / Local Database Profile
# ==============================================================================
# Make sure your MySQL service is running on port 3306.
# You can change username/password here to match your local MySQL credentials.

spring.datasource.url=jdbc:mysql://localhost:3306/vehiclerental_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
